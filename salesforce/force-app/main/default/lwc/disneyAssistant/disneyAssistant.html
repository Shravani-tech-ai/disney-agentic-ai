<template>
    <lightning-card title="Disney Assistant" icon-name="utility:chat">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={agents.length}>
                <div class="agent-strip slds-m-bottom_medium"><span class="slds-text-title_bold">Available specialists:</span>
                    <template for:each={agents} for:item="agent"><span key={agent.name} class="agent-pill">{agent.name}</span></template>
                </div>
            </template>
            <div class="chat-window" role="log" aria-live="polite">
                <template for:each={messages} for:item="item">
                    <div key={item.id} class={item.cssClass}>
                        <div class="bubble-label">{item.label}</div><div class="bubble-text">{item.text}</div>
                        <template if:true={item.intent}><div class="message-meta">Intent: {item.intent}</div></template>
                        <template if:true={item.mock}><div class="mock-note">Demo data — not live Disney availability</div></template>
                    </div>
                </template>
                <template if:true={loading}><div class="loading-line"><lightning-spinner size="small" alternative-text="Thinking"></lightning-spinner><span>Assistant is thinking…</span></div></template>
            </div>
            <div class="composer slds-m-top_medium">
                <lightning-textarea label="Ask the Disney assistant" variant="label-hidden" placeholder="Ask about products, guest profiles, reservations, dining or Lightning Lane…" value={draft} onchange={handleDraft} onkeydown={handleKeydown} max-length="4000"></lightning-textarea>
                <lightning-button variant="brand" label="Send" onclick={sendMessage} disabled={sendDisabled} class="send-button"></lightning-button>
            </div>
            <p class="slds-text-color_weak slds-text-body_small slds-m-top_x-small">This demo uses simulated Disney data. It does not access or change real Disney accounts or reservations.</p>
        </div>
    </lightning-card>
</template>
