<template>
    <lightning-card title="Disney AI Observability">

        <lightning-tabset
            active-tab-value={activeTab}
            onactive={handleTabChange}>

            <lightning-tab label="Chat" value="chat">
                <div class="panel">

                    <lightning-textarea
                        label="Ask Disney Assistant"
                        value={message}
                        onchange={handleMessageChange}>
                    </lightning-textarea>

                    <lightning-button
                        label="Send"
                        variant="brand"
                        onclick={handleSend}
                        disabled={isLoading}>
                    </lightning-button>

                    <template if:true={answer}>
                        <div class="answer">
                            <h3>Assistant Response</h3>
                            <p>{answer}</p>

                            <p>Trace ID: {traceId}</p>
                            <p>Latency: {latencyMs} ms</p>
                        </div>
                    </template>

                </div>
            </lightning-tab>

            <lightning-tab label="Trace" value="trace">

                <div class="panel">

                    <lightning-input
                        label="Trace ID"
                        value={traceId}
                        onchange={handleTraceIdChange}>
                    </lightning-input>

                    <lightning-button
                        label="Load Trace"
                        onclick={loadTrace}>
                    </lightning-button>

                    <template if:true={trace}>
                        <h3>Trace Details</h3>

                        <p>Status: {trace.status}</p>
                        <p>Latency: {trace.latency_ms} ms</p>

                        <template
                            for:each={trace.events}
                            for:item="event">

                            <div key={event.event_id}
                                 class="event-card">

                                <p>{event.event_type}</p>
                                <strong>{event.name}</strong>
                                <p>{event.duration_ms} ms</p>

                            </div>

                        </template>
                    </template>

                </div>

            </lightning-tab>

            <lightning-tab label="Routing" value="routing">

                <div class="panel">

                    <h3>Executed Agents</h3>

                    <template
                        for:each={selectedAgents}
                        for:item="agent">

                        <div key={agent} class="agent-card">
                            <lightning-icon
                                icon-name="utility:check"
                                size="small">
                            </lightning-icon>
                            {agent}
                        </div>

                    </template>

                </div>

            </lightning-tab>

            <lightning-tab label="Metrics" value="metrics">

                <div class="panel">

                    <lightning-button
                        label="Refresh Metrics"
                        onclick={loadMetrics}>
                    </lightning-button>

                    <template if:true={metrics}>

                        <div class="metric-grid">

                            <div class="metric-card">
                                <h2>{metrics.total_traces}</h2>
                                <p>Total Traces</p>
                            </div>

                            <div class="metric-card">
                                <h2>{metrics.average_latency_ms}</h2>
                                <p>Average Latency (ms)</p>
                            </div>

                            <div class="metric-card">
                                <h2>{metrics.p95_latency_ms}</h2>
                                <p>P95 Latency (ms)</p>
                            </div>

                            <div class="metric-card">
                                <h2>{metrics.success_rate}%</h2>
                                <p>Success Rate</p>
                            </div>

                            <div class="metric-card">
                                <h2>{metrics.total_tool_calls}</h2>
                                <p>Tool Calls</p>
                            </div>

                        </div>

                    </template>

                </div>

            </lightning-tab>

        </lightning-tabset>

    </lightning-card>
</template>
